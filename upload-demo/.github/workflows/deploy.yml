name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: upload-demo/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: upload-demo
      
      - name: Build
        run: node build.mjs
        working-directory: upload-demo
        env:
          NODE_ENV: production
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upload-demo/dist
      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4